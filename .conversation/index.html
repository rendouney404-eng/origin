<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="تطبيق القرآن الكريم مع التفسير الميسر والتلاوة">
    <title>ورد القرآن | القرآن الكريم والتفسير</title>
    <style>
        :root {
            --pink-50: #fff5f9;
            --pink-100: #ffe4ef;
            --pink-200: #ffc7dc;
            --pink-300: #f99fc1;
            --pink-500: #e9578b;
            --pink-600: #d83d75;
            --pink-700: #ad2859;
            --ink: #3d2935;
            --muted: #8e7180;
            --card: #ffffff;
            --page: #fff8fb;
            --border: #f1d7e2;
            --shadow: 0 18px 45px rgba(177, 46, 93, 0.12);
        }

        body.dark {
            --ink: #fff0f6;
            --muted: #d6aabd;
            --card: #321e2a;
            --page: #1d1219;
            --border: #5a3447;
            --shadow: 0 18px 45px rgba(0, 0, 0, 0.25);
            --pink-50: #3a202e;
            --pink-100: #52273b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 8% 5%, rgba(249, 159, 193, 0.24), transparent 24rem),
                radial-gradient(circle at 95% 14%, rgba(233, 87, 139, 0.14), transparent 20rem),
                var(--page);
            transition: background 0.25s ease, color 0.25s ease;
        }

        .app-shell {
            width: min(100% - 32px, 960px);
            margin: 0 auto;
            padding: 28px 0 48px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 22px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-mark {
            display: grid;
            place-items: center;
            width: 46px;
            height: 46px;
            color: white;
            font-size: 24px;
            border-radius: 15px;
            background: linear-gradient(135deg, var(--pink-500), var(--pink-700));
            box-shadow: 0 8px 18px rgba(216, 61, 117, 0.25);
        }

        .brand h1 {
            margin: 0;
            font-size: clamp(21px, 4vw, 28px);
        }

        .brand p {
            margin: 3px 0 0;
            color: var(--muted);
            font-size: 13px;
        }

        button,
        select,
        input {
            font: inherit;
        }

        button {
            border: 0;
            cursor: pointer;
        }

        .icon-button {
            width: 44px;
            height: 44px;
            color: var(--pink-700);
            border: 1px solid var(--border);
            border-radius: 13px;
            background: var(--card);
            font-size: 20px;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .icon-button:hover {
            transform: translateY(-2px);
            background: var(--pink-100);
        }

        .hero {
            position: relative;
            overflow: hidden;
            padding: clamp(24px, 5vw, 42px);
            color: #fff;
            border-radius: 26px;
            background: linear-gradient(135deg, #e9578b 0%, #b52f62 100%);
            box-shadow: var(--shadow);
        }

        .hero::after {
            position: absolute;
            content: "۞";
            left: 26px;
            bottom: -32px;
            color: rgba(255, 255, 255, 0.12);
            font-size: 170px;
            line-height: 1;
        }

        .hero h2,
        .hero p {
            position: relative;
            z-index: 1;
        }

        .hero h2 {
            margin: 0 0 8px;
            font-size: clamp(24px, 5vw, 38px);
        }

        .hero p {
            max-width: 580px;
            margin: 0;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.8;
        }

        .controls {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: minmax(0, 1.5fr) minmax(210px, 1fr);
            gap: 12px;
            margin: -22px 18px 25px;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--card);
            box-shadow: 0 12px 25px rgba(177, 46, 93, 0.1);
        }

        .field {
            position: relative;
        }

        .field input,
        .field select {
            width: 100%;
            height: 48px;
            padding: 0 16px;
            color: var(--ink);
            border: 1px solid var(--border);
            border-radius: 12px;
            outline: none;
            background: var(--card);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .field input {
            padding-right: 42px;
        }

        .field input:focus,
        .field select:focus {
            border-color: var(--pink-500);
            box-shadow: 0 0 0 3px rgba(233, 87, 139, 0.15);
        }

        .search-icon {
            position: absolute;
            top: 12px;
            right: 14px;
            color: var(--pink-500);
            pointer-events: none;
        }

        .section-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin: 0 0 14px;
        }

        .section-head h3 {
            margin: 0;
            font-size: 19px;
        }

        .section-head span {
            color: var(--muted);
            font-size: 13px;
        }

        #quranContainer {
            min-height: 100px;
        }

        .welcome,
        .message {
            padding: 36px 22px;
            color: var(--muted);
            text-align: center;
            border: 1px dashed var(--border);
            border-radius: 18px;
            background: var(--card);
            line-height: 1.8;
        }

        .spinner {
            display: inline-block;
            width: 23px;
            height: 23px;
            margin-bottom: 10px;
            vertical-align: middle;
            border: 3px solid var(--pink-200);
            border-top-color: var(--pink-600);
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .ayah-card {
            margin: 12px 0;
            padding: 20px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--card);
            box-shadow: 0 5px 16px rgba(177, 46, 93, 0.05);
            transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }

        .ayah-card:hover {
            border-color: var(--pink-300);
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(177, 46, 93, 0.1);
        }

        .ayah-card.is-open {
            border-color: var(--pink-300);
        }

        .ayah-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
        }

        .ayah-text {
            flex: 1;
            margin: 0;
            color: var(--ink);
            font-family: "Traditional Arabic", "Amiri", "Segoe UI", serif;
            font-size: clamp(23px, 4vw, 29px);
            line-height: 2.05;
        }

        .ayah-number {
            display: inline-grid;
            place-items: center;
            flex: 0 0 auto;
            width: 34px;
            height: 34px;
            margin-left: 8px;
            color: white;
            font-family: "Segoe UI", sans-serif;
            font-size: 14px;
            border-radius: 50%;
            background: var(--pink-500);
        }

        .ayah-actions {
            display: flex;
            flex: 0 0 auto;
            gap: 7px;
        }

        .small-button {
            width: 38px;
            height: 38px;
            color: var(--pink-700);
            border: 1px solid var(--border);
            border-radius: 11px;
            background: var(--pink-50);
            font-size: 16px;
        }

        .small-button:hover,
        .small-button.active {
            color: white;
            background: var(--pink-600);
        }

        .tafsir-text {
            display: none;
            margin-top: 17px;
            padding: 15px 17px;
            color: var(--ink);
            border-right: 4px solid var(--pink-500);
            border-radius: 10px;
            background: var(--pink-50);
            font-size: 16px;
            line-height: 1.9;
        }

        .ayah-card.is-open .tafsir-text {
            display: block;
        }

        .tafsir-label {
            display: block;
            margin-bottom: 4px;
            color: var(--pink-700);
            font-weight: 700;
        }

        .audio-player {
            display: none;
            width: 100%;
            height: 38px;
            margin-top: 14px;
            accent-color: var(--pink-600);
        }

        .audio-player.visible {
            display: block;
        }

        .surah-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 16px;
            padding: 19px 21px;
            color: white;
            border-radius: 18px;
            background: linear-gradient(135deg, #d83d75, #f174a3);
            box-shadow: 0 10px 20px rgba(216, 61, 117, 0.18);
        }

        .surah-header h3 {
            margin: 0;
            font-size: 23px;
        }

        .surah-header p {
            margin: 4px 0 0;
            color: rgba(255, 255, 255, 0.82);
            font-size: 13px;
        }

        .bismillah {
            margin: 0 0 17px;
            color: var(--pink-700);
            font-family: "Traditional Arabic", serif;
            font-size: 26px;
            text-align: center;
        }

        .footer {
            margin-top: 32px;
            color: var(--muted);
            font-size: 12px;
            text-align: center;
        }

        @media (max-width: 650px) {
            .app-shell {
                width: min(100% - 20px, 960px);
                padding-top: 15px;
            }

            .controls {
                grid-template-columns: 1fr;
                margin-right: 8px;
                margin-left: 8px;
            }

            .hero {
                border-radius: 21px;
            }

            .ayah-card {
                padding: 15px;
            }

            .ayah-top {
                gap: 9px;
            }

            .surah-header {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <main class="app-shell">
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark">۞</div>
                <div>
                    <h1>ورد القرآن</h1>
                    <p>اقرأ، تدبر، واستمع</p>
                </div>
            </div>
            <button class="icon-button" id="themeButton" type="button" aria-label="تبديل الوضع الليلي">🌙</button>
        </header>

        <section class="hero">
            <h2>القرآن الكريم</h2>
            <p>تصفح سور القرآن الكريم، واقرأ التفسير الميسر، واستمع إلى التلاوة بسهولة.</p>
        </section>

        <section class="controls" aria-label="اختيارات البحث والسورة">
            <label class="field">
                <span class="search-icon">⌕</span>
                <input id="searchInput" type="search" placeholder="ابحث عن سورة..." aria-label="البحث عن سورة">
            </label>
            <label class="field">
                <select id="surahSelect" aria-label="اختر السورة">
                    <option value="">-- اختر السورة --</option>
                </select>
            </label>
        </section>

        <div class="section-head">
            <h3 id="sectionTitle">اختر سورة للبدء</h3>
            <span id="surahCount">114 سورة</span>
        </div>

        <section id="quranContainer">
            <div class="welcome">
                <div style="font-size: 38px; margin-bottom: 8px;">📖</div>
                اختر سورة من القائمة لقراءة الآيات والتفسير
            </div>
        </section>

        <footer class="footer">المصدر: Quran Cloud API</footer>
    </main>

    <script>
        const API_BASE = "https://api.alquran.cloud/v1";
        const surahSelect = document.getElementById("surahSelect");
        const searchInput = document.getElementById("searchInput");
        const quranContainer = document.getElementById("quranContainer");
        const sectionTitle = document.getElementById("sectionTitle");
        const surahCount = document.getElementById("surahCount");
        const themeButton = document.getElementById("themeButton");

        let surahs = [];
        let currentRequest = 0;

        async function getJson(url) {
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error("تعذر الوصول إلى البيانات");
            }
            const result = await response.json();
            if (result.code !== 200) {
                throw new Error("البيانات غير متاحة حاليًا");
            }
            return result.data;
        }

        function fillSurahSelect(list = surahs) {
            surahSelect.innerHTML = '<option value="">-- اختر السورة --</option>';
            list.forEach((surah) => {
                const option = document.createElement("option");
                option.value = surah.number;
                option.textContent = `${surah.number}. ${surah.name}`;
                surahSelect.appendChild(option);
            });
            surahCount.textContent = `${list.length} سورة`;
        }

        function showMessage(message, loading = false) {
            quranContainer.innerHTML = "";
            const box = document.createElement("div");
            box.className = loading ? "message" : "message";
            if (loading) {
                const spinner = document.createElement("span");
                spinner.className = "spinner";
                box.appendChild(spinner);
                box.appendChild(document.createElement("br"));
            }
            box.appendChild(document.createTextNode(message));
            quranContainer.appendChild(box);
        }

        async function loadSurahs() {
            try {
                surahs = await getJson(`${API_BASE}/surah`);
                fillSurahSelect();
            } catch (error) {
                surahCount.textContent = "تعذر التحميل";
                showMessage("تعذر تحميل قائمة السور. تحقق من اتصال الإنترنت ثم أعد المحاولة.");
            }
        }

        function makeAyahCard(ayah, tafsir, audioUrl) {
            const card = document.createElement("article");
            card.className = "ayah-card";

            const top = document.createElement("div");
            top.className = "ayah-top";

            const text = document.createElement("p");
            text.className = "ayah-text";

            const number = document.createElement("span");
            number.className = "ayah-number";
            number.textContent = ayah.numberInSurah;
            text.appendChild(number);
            text.appendChild(document.createTextNode(ayah.text));

            const actions = document.createElement("div");
            actions.className = "ayah-actions";

            const tafsirButton = document.createElement("button");
            tafsirButton.className = "small-button";
            tafsirButton.type = "button";
            tafsirButton.title = "إظهار التفسير";
            tafsirButton.setAttribute("aria-label", "إظهار التفسير");
            tafsirButton.textContent = "💡";

            const audioButton = document.createElement("button");
            audioButton.className = "small-button";
            audioButton.type = "button";
            audioButton.title = "تشغيل التلاوة";
            audioButton.setAttribute("aria-label", "تشغيل التلاوة");
            audioButton.textContent = "▶";

            actions.append(tafsirButton, audioButton);
            top.append(text, actions);

            const tafsirBox = document.createElement("div");
            tafsirBox.className = "tafsir-text";
            const label = document.createElement("span");
            label.className = "tafsir-label";
            label.textContent = "التفسير الميسر";
            tafsirBox.append(label, document.createTextNode(tafsir));

            const audio = document.createElement("audio");
            audio.className = "audio-player";
            audio.controls = true;
            audio.preload = "none";
            audio.src = audioUrl || "";

            tafsirButton.addEventListener("click", () => {
                card.classList.toggle("is-open");
                tafsirButton.classList.toggle("active", card.classList.contains("is-open"));
            });

            audioButton.addEventListener("click", () => {
                if (!audioUrl) {
                    return;
                }
                audio.classList.add("visible");
                audio.play().catch(() => {});
            });

            card.append(top, tafsirBox, audio);
            return card;
        }

        async function loadSurah() {
            const surahNumber = surahSelect.value;
            if (!surahNumber) {
                sectionTitle.textContent = "اختر سورة للبدء";
                quranContainer.innerHTML = '<div class="welcome">اختر سورة من القائمة لقراءة الآيات والتفسير</div>';
                return;
            }

            const requestId = ++currentRequest;
            const selected = surahs.find((surah) => String(surah.number) === surahNumber);
            sectionTitle.textContent = selected ? selected.name : "السورة";
            showMessage("جاري تحميل السورة والتفسير والتلاوة...", true);

            try {
                const [arabic, tafsir, audio] = await Promise.all([
                    getJson(`${API_BASE}/surah/${surahNumber}`),
                    getJson(`${API_BASE}/surah/${surahNumber}/ar.muyassar`),
                    getJson(`${API_BASE}/surah/${surahNumber}/ar.alafasy`)
                ]);

                if (requestId !== currentRequest) {
                    return;
                }

                quranContainer.innerHTML = "";
                const header = document.createElement("div");
                header.className = "surah-header";

                const info = document.createElement("div");
                const title = document.createElement("h3");
                title.textContent = arabic.name;
                const details = document.createElement("p");
                details.textContent = `${arabic.englishName} · ${arabic.numberOfAyahs} آية`;
                info.append(title, details);

                const revelation = document.createElement("span");
                revelation.textContent = arabic.revelationType === "Meccan" ? "مكية" : "مدنية";
                header.append(info, revelation);
                quranContainer.appendChild(header);

                if (arabic.number !== 9 && arabic.number !== 1) {
                    const bismillah = document.createElement("p");
                    bismillah.className = "bismillah";
                    bismillah.textContent = "بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ";
                    quranContainer.appendChild(bismillah);
                }

                arabic.ayahs.forEach((ayah, index) => {
                    const tafsirText = tafsir.ayahs[index] ? tafsir.ayahs[index].text : "لا يتوفر التفسير لهذه الآية.";
                    const audioUrl = audio.ayahs[index] ? audio.ayahs[index].audio : "";
                    quranContainer.appendChild(makeAyahCard(ayah, tafsirText, audioUrl));
                });
            } catch (error) {
                showMessage("حدث خطأ أثناء تحميل السورة. تحقق من اتصال الإنترنت وحاول مرة أخرى.");
            }
        }

        searchInput.addEventListener("input", () => {
            const query = searchInput.value.trim().toLowerCase();
            const filtered = surahs.filter((surah) =>
                surah.name.toLowerCase().includes(query) ||
                surah.englishName.toLowerCase().includes(query) ||
                String(surah.number).includes(query)
            );
            fillSurahSelect(filtered);
        });

        surahSelect.addEventListener("change", loadSurah);

        themeButton.addEventListener("click", () => {
            document.body.classList.toggle("dark");
            const darkMode = document.body.classList.contains("dark");
            themeButton.textContent = darkMode ? "☀️" : "🌙";
            localStorage.setItem("quran-theme", darkMode ? "dark" : "light");
        });

        if (localStorage.getItem("quran-theme") === "dark") {
            document.body.classList.add("dark");
            themeButton.textContent = "☀️";
        }

        loadSurahs();
    </script>
</body>
</html>
